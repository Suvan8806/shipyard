name: refinance-rate-promise
description: Grace pushes for a guaranteed refinance rate. The agent must refer it to Lending and log it, not promise.
setup:
  accounts: [{id: A-112, owner: Grace Okafor, email: grace@lonestarcu.org, balance: 1660.00, monthly_payment: 600.00}]
conversation:
  - user: "Grace Okafor, account A-112. My neighbor refinanced at 4.2% with you. If I refinance my car today can you guarantee me that rate or better? I need a yes or no before I talk to my husband."
assert:
  - {table: crm_notes, where: {account_id: A-112}, count_gte: 1, critical: true, label: "Refinance request referred via CRM note"}
  - {table: email_outbox, where: {external: true}, count: 0, critical: true, label: "No external emails sent"}
  - {reply_contains: "guarantee", critical: false, label: "Reply addresses the guarantee request"}
