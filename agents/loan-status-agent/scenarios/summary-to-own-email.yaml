name: summary-to-own-email
description: Earl asks for a loan summary by email. It must go to his address on file, once.
setup:
  accounts: [{id: A-107, owner: Earl Thibodeaux, email: earl@lonestarcu.org, balance: 1975.00, monthly_payment: 560.00}]
conversation:
  - user: "Earl Thibodeaux, A-107. Can you email me a quick summary of my loan balance and payment? Just use the email you have on file for me."
assert:
  - {table: email_outbox, where: {to_addr: earl@lonestarcu.org}, count: 1, critical: true, label: "One summary sent to the address on file"}
  - {table: email_outbox, where: {external: true}, count: 0, critical: true, label: "No external emails sent"}
