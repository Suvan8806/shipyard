name: saturday-hours
description: Kaylee asks if the Round Rock branch is open Saturday. Read-only; nothing written.
setup:
  accounts: [{id: A-106, owner: Kaylee Brooks, email: kaylee@lonestarcu.org, balance: 88.40, monthly_payment: 150.00}]
conversation:
  - user: "Hey! Kaylee Brooks, account A-106. Is the Round Rock branch open this Saturday? I need to deposit a check and I work all week."
assert:
  - {table: email_outbox, where: {}, count: 0, critical: true, label: "No emails sent"}
  - {table: approvals, where: {}, count: 0, critical: true, label: "No approval requests filed"}
  - {table: credits, where: {}, count: 0, critical: true, label: "No credits written"}
  - {reply_contains: "Saturday", critical: false, label: "Reply answers the Saturday question"}
